name: CI

on:
  push:
    branches: [dev, main]
  # Every pull request, whatever it targets. Filtering by base branch silently skips CI on a
  # stacked PR (one whose base is another feature branch), so the stack reports "no checks
  # reported" and merges on nothing but the author's word.
  #
  # `edited` is here for `slop`, which reads the PR body: without it a body that adds the concept
  # budget the job just asked for never re-runs the job, and the author has to push a commit that
  # changes nothing to clear a red check. The two heavy jobs opt out below, so an edit costs one
  # short run rather than the whole suite.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # An `edited` run skips the two heavy jobs, so cancelling for it strands `Python 3.12` and
  # `Python 3.13` at `cancelled` with no later event to replace them (#444).
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  test:
    # Nothing about the code changed, so neither can the answer.
    if: github.event.action != 'edited'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # The Redis and Postgres event logs are contract-tested against real servers (#75):
    # a store proved only against a mock is not proved. Service containers rather than
    # testcontainers: the gate already installs one dependency set and runs one command,
    # and this keeps the servers out of the Python environment entirely.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Spelled out rather than left to the harness's own defaults, so the addresses the
    # gate runs against are visible next to the containers that serve them.
    env:
      AGENTDECK_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AGENTDECK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agentdeck_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The schema's backward-compatibility gate (#47) loads the newest *released*
          # reader out of git (by tag) and measures this tree's events against it. The
          # default depth-1 checkout has neither that tag nor its history, so the gate
          # would skip, and prove nothing while going green.
          fetch-depth: 0
      # `check-added-large-files` is a pre-commit hook, so it never runs for a contributor who
      # has not installed hooks, which is most first PRs. A size cap could not do this job
      # anyway: `uv.lock` is 336KB of legitimate text, so any threshold that clears it also
      # clears every image. Location is the rule that holds (coding-standards §11), and a diff
      # against the empty tree is git's own answer to "which of these are binary".
      - name: No binaries outside .github/assets/
        run: |
          strays=$(git diff --numstat 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD \
                     | awk '$1 == "-" { print $3 }' | grep -v '^\.github/assets/' || true)
          if [ -n "$strays" ]; then
            echo "::error::binary files outside .github/assets/: see docs/coding-standards.md §11"
            echo "$strays"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # postgres pulls in the psycopg driver the Postgres event log's tests need: omitting an
      # extra here let ~16 tests skip silently in the gate of record for months (#33).
      # observability was the same mistake one extra over (#142): without it the 12
      # tests in test_observability.py and test_langfuse_tracer.py skip, which is how
      # #141's keyless-AsyncOpenAI regression shipped green. Install every extra the
      # suite guards on: a narrower gate is a gate that lies.
      - name: Install
        run: uv pip install -e ".[dev,serve,postgres,observability]"
      # Two seconds here beats a full suite that skips the half it was meant to prove: if an
      # extra silently failed to install, every test guarding on it turns into a skip and the
      # gate goes green having measured nothing (#33, #142).
      - name: Every guarded extra is importable
        run: .venv/bin/python -c "import fastapi, uvicorn, langfuse, psycopg, redis"
      - name: Lint
        run: .venv/bin/ruff check agentdeck/ tests/
      - name: Typecheck
        run: .venv/bin/ty check agentdeck
      - name: Import contracts
        run: .venv/bin/lint-imports
      - name: Test
        run: .venv/bin/pytest tests/ -q --junit-xml=/tmp/pytest-results.xml
      # Skips come in two kinds. "only a suspended case can be resumed" is the contract matrix
      # declaring which cells apply: harmless, and it grows whenever a case is added, which is
      # why counting total skips drifted and false-positived. "needs the [postgres] extra" or
      # "no Postgres at ..." is a subsystem that dropped out of the gate, which is the thing
      # #33 is actually about. Match the reasons, not the count: this never needs maintaining
      # when the test matrix moves, and when it fires it names what is missing.
      - name: No subsystem dropped out of the gate
        run: |
          if grep -qE 'needs the \[[a-z]+\] extra|no Postgres at|no Redis at' /tmp/pytest-results.xml; then
            echo "::error::a subsystem skipped out of the gate: an extra or a service container is missing"
            grep -oE 'needs the \[[a-z]+\] extra|no (Postgres|Redis) at [^"]*' /tmp/pytest-results.xml | sort -u
            exit 1
          fi
      # `Test` already replayed the goldens once; this second, separate process is what
      # proves the snapshots don't depend on process state (in-process stability has its
      # own test).
      - name: Golden replay (second process)
        run: .venv/bin/pytest tests/golden -q
      - name: Build
        run: uv build

  check:
    name: check
    # `always()` so a failed matrix still reports. Unlike `test`, this one never opts out of an
    # edited body: it is a required context, and a required check that reports *skipped* does not
    # satisfy the rule, so opting out here would block the PR instead of saving a run.
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the supported-version matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        # `skipped` is the edited-body path: the matrix deliberately did not run because no code
        # changed, so the conclusions from the last push are the ones that stand.
        run: test "$MATRIX_RESULT" = success -o "$MATRIX_RESULT" = skipped

  # The anti-slop gate for code that never went through a Claude Code hook:
  # outside contributors, and anything written by a process the Edit|Write
  # matcher never saw. Same scripts, PR-base-relative, stdlib only.
  slop:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comment slop on lines this PR adds
        run: python3 scripts/slopcheck.py --changed --base "origin/${{ github.base_ref }}" < /dev/null
      - name: Commit metadata has no agent attribution
        run: python3 scripts/check_commit_hygiene.py "origin/${{ github.base_ref }}"
      - name: Concept budget honored (new classes/symbols/modules/deps declared)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/concept_budget.py "origin/${{ github.base_ref }}"
      - name: Quality delta
        run: python3 scripts/quality_delta.py "origin/${{ github.base_ref }}"
