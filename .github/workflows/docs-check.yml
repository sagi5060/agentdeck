name: Documentation checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# `Build documentation` is a required context, and a cancelled run leaves it absent, which branch
# protection cannot tell from a failure. The next `synchronize` normally replaces it; when it stays
# absent, close and reopen the PR, which fires a genuine `pull_request` event. `workflow_dispatch`
# does not clear it: GitHub does not associate a dispatch run with a pull request (#408).

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A required check reporting *skipped* does not satisfy branch protection, so the job always
      # runs and the build steps opt out instead. Every run of this gate has passed, because
      # almost none of them touched the site it builds.
      - name: Documentation sources changed?
        id: changed
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ] || git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^docs-site/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No docs-site/ changes; the build has nothing new to prove."
          fi

      - name: Set up Node.js
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build static documentation
        if: steps.changed.outputs.run == 'true'
        run: npm run build

      - name: Verify static export
        if: steps.changed.outputs.run == 'true'
        run: test -f out/index.html

      - name: Verify search index
        if: steps.changed.outputs.run == 'true'
        run: test -f out/_pagefind/pagefind.js
